# Hical 多平台 Docker 测试
#
# 用法：
#   全部测试:   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit
#   仅 GCC 14:  docker compose -f docker-compose.test.yml up --build gcc14
#   仅 Clang:   docker compose -f docker-compose.test.yml up --build clang20
#   仅静态分析: docker compose -f docker-compose.test.yml up --build clang20-tidy
#
# 注：Ubuntu 24.04 自带 Boost 1.83，不满足 DB 中间件所需的 >= 1.85，
#     因此 HICAL_WITH_DATABASE 未启用。DB 测试由 GitHub Actions CI 覆盖。

services:
  gcc14:
    build:
      context: .
      dockerfile: docker/gcc14.Dockerfile

  clang20:
    build:
      context: .
      dockerfile: docker/clang20.Dockerfile

  clang20-tidy:
    build:
      context: .
      dockerfile: docker/clang20-tidy.Dockerfile
