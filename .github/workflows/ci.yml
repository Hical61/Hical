name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'ports/**'
      - 'benchmark/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'ports/**'
      - 'benchmark/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
            cc: gcc-14
            cxx: g++-14
          - os: ubuntu-24.04
            compiler: clang
            cc: clang-20
            cxx: clang++-20
          - os: windows-latest
            compiler: msys2-gcc
          - os: windows-latest
            compiler: msvc

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ── Linux 依赖 ──
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" | sudo tee /etc/apt/sources.list.d/llvm-20.list
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev libssl-dev libgtest-dev liburing-dev zlib1g-dev cmake gcovr clang-20 clang-tidy-20
          pip install clang-format==22.1.2

      # ── ccache 加速编译 (Linux) ──
      - name: Setup ccache
        if: runner.os == 'Linux'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.os }}-${{ matrix.compiler }}

      # ── Linux 构建与测试 ──
      - name: Configure (Linux)
        if: runner.os == 'Linux' && matrix.compiler != 'clang'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DHICAL_DISABLE_IO_URING=ON

      - name: Build (Linux)
        if: runner.os == 'Linux' && matrix.compiler != 'clang'
        run: cmake --build build -j$(nproc)

      - name: Test (Linux)
        if: runner.os == 'Linux' && matrix.compiler != 'clang'
        run: ctest --test-dir build --output-on-failure --timeout 60 -j4 -E 'RouterPerfTest|PerfectHashPerfTest|HttpServerPerfTest'

      # ── Clang: Sanitizer 构建 (ASan + UBSan) ──
      - name: Configure with sanitizers (Clang)
        if: matrix.compiler == 'clang'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DHICAL_DISABLE_IO_URING=ON

      - name: Build with sanitizers (Clang)
        if: matrix.compiler == 'clang'
        run: cmake --build build -j$(nproc)

      - name: Test with sanitizers (Clang)
        if: matrix.compiler == 'clang'
        run: ctest --test-dir build --output-on-failure --timeout 120 -j4 -E 'RouterPerfTest|PerfectHashPerfTest|HttpServerPerfTest'

      # ── clang-tidy 检查 (仅 Clang job, 警告模式) ──
      - name: Run clang-tidy
        if: matrix.compiler == 'clang'
        continue-on-error: true
        run: |
          find src -name '*.cpp' | xargs clang-tidy-20 -p build

      # ── 代码覆盖率 (仅 GCC job) ──
      - name: Build with coverage (GCC)
        if: matrix.compiler == 'gcc'
        run: |
          cmake -B build-cov -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -DCMAKE_C_FLAGS="--coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DHICAL_DISABLE_IO_URING=ON
          cmake --build build-cov -j$(nproc)

      - name: Run tests for coverage
        if: matrix.compiler == 'gcc'
        run: ctest --test-dir build-cov --output-on-failure --timeout 60 -j4 -E 'RouterPerfTest|PerfectHashPerfTest|HttpServerPerfTest'

      - name: Generate coverage report
        if: matrix.compiler == 'gcc'
        run: |
          gcovr --xml -o coverage.xml \
            --gcov-executable gcov-14 \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            --root . --filter 'src/' \
            --exclude 'tests/' --exclude 'examples/'

      - name: Upload coverage to Codecov
        if: matrix.compiler == 'gcc'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # ── 自动格式化修复 (仅 GCC job, 仅非 fork 的 PR) ──
      - name: Auto-fix formatting
        if: >-
          matrix.compiler == 'gcc'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          find src tests examples -name '*.h' -o -name '*.cpp' | \
            xargs clang-format -i
          python3 scripts/fix-comment-indent.py \
            $(find src tests examples -name '*.h' -o -name '*.cpp')

      - name: Commit formatting fixes
        if: >-
          matrix.compiler == 'gcc'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[chore] auto-fix formatting"
          branch: ${{ github.head_ref }}

      # ── clang-format 严格检查 (GCC job: push 到 main 或 PR 均检查) ──
      - name: Check formatting
        if: matrix.compiler == 'gcc'
        run: |
          find src tests examples -path '*/third_party' -prune -o \( -name '*.h' -o -name '*.cpp' \) -print | \
            xargs clang-format --dry-run --Werror
          python3 scripts/fix-comment-indent.py --check \
            $(find src tests examples -path '*/third_party' -prune -o \( -name '*.h' -o -name '*.cpp' \) -print)

      # ── Windows MSYS2 ──
      - name: Setup MSYS2
        if: matrix.compiler == 'msys2-gcc'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          cache: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-gtest

      - name: Configure (MSYS2)
        if: matrix.compiler == 'msys2-gcc'
        shell: msys2 {0}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build (MSYS2)
        if: matrix.compiler == 'msys2-gcc'
        shell: msys2 {0}
        run: cmake --build build

      - name: Test (MSYS2)
        if: matrix.compiler == 'msys2-gcc'
        shell: msys2 {0}
        run: |
          ctest --test-dir build --output-on-failure --timeout 60 -j4 -E 'RouterPerfTest|PerfectHashPerfTest|HttpServerPerfTest' || {
            echo "First attempt failed (likely MinGW exit-time segfault), retrying..."
            ctest --test-dir build --output-on-failure --timeout 60 -j4 -E 'RouterPerfTest|PerfectHashPerfTest|HttpServerPerfTest'
          }

      # ── Windows MSVC ──
      - name: Install ninja (MSVC)
        if: matrix.compiler == 'msvc'
        run: choco install ninja ccache -y

      - name: Setup ccache (MSVC)
        if: matrix.compiler == 'msvc'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.os }}-${{ matrix.compiler }}

      - name: Setup vcpkg cache (MSVC)
        if: matrix.compiler == 'msvc'
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-msvc-x64-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-msvc-x64-

      - name: Configure (MSVC)
        if: matrix.compiler == 'msvc'
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
        env:
          CCACHE_COMPILERTYPE: msvc

      - name: Build (MSVC)
        if: matrix.compiler == 'msvc'
        run: cmake --build build --config Release
        env:
          CCACHE_COMPILERTYPE: msvc

      - name: Test (MSVC)
        if: matrix.compiler == 'msvc'
        run: ctest --test-dir build --output-on-failure --timeout 60 -j4 -C Release -E 'RouterPerfTest|PerfectHashPerfTest|HttpServerPerfTest'

  # ── 中间件 profiling 构建（打开 HICAL_ENABLE_MIDDLEWARE_PROFILING） ──
  # 这个选项默认 OFF，上面那个 build job 从来不开它，于是 tests/test_middleware.cpp 里
  # #ifdef HICAL_ENABLE_MIDDLEWARE_PROFILING 包住的 MiddlewareProfilingTest 用例在所有
  # CI 里都不参与编译。那几条用例守的是「profiling 模式下 Sync 中间件被整条丢弃、认证/限流
  # 静默 fail-open」这个缺陷，没人守着的话，重构 MiddlewarePipeline::build() 会无声退回原状。
  # 只起 Linux + GCC 一路，不铺矩阵，CI 时间克制。
  middleware-profiling:
    runs-on: ubuntu-24.04
    name: ubuntu-24.04 / gcc / middleware-profiling
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev libssl-dev libgtest-dev liburing-dev zlib1g-dev cmake

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ubuntu-24.04-gcc-middleware-profiling

      - name: Configure (middleware profiling)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DHICAL_ENABLE_MIDDLEWARE_PROFILING=ON \
            -DHICAL_DISABLE_IO_URING=ON

      - name: Build (middleware profiling)
        run: cmake --build build -j$(nproc)

      - name: Test (middleware profiling)
        run: ctest --test-dir build --output-on-failure --timeout 60 -j4 -E 'RouterPerfTest|PerfectHashPerfTest|HttpServerPerfTest'

      # 光看 ctest 绿没用：profiling 没打开、用例被 #ifdef 编没了的时候 gtest 照样返回 0
      # （只打印 "0 tests from 0 test suites" 和一句 WARNING）。所以这里显式逐条确认用例名
      # 真的出现在 [ OK ] 行里，把「跑了」和「没编进来」区分开。
      - name: Assert MiddlewareProfilingTest actually ran
        run: |
          bin=$(find build -type f -name 'test_middleware' -print -quit)
          if [[ -z $bin || ! -x $bin ]]; then
            echo "::error::找不到 test_middleware 测试可执行文件，构建产物布局和预期不符"
            exit 1
          fi
          out=$("$bin" --gtest_filter='MiddlewareProfilingTest.*' --gtest_color=no)
          echo "$out"
          for t in MiddlewareProfilingTest.SyncMiddlewareStillRunsInsteadOfBeingDropped \
                   MiddlewareProfilingTest.MixedSyncAndAsyncFallsBackWithoutFakeStats \
                   MiddlewareProfilingTest.BuildForKeepsSyncMiddleware; do
            grep -q "OK ] $t" <<< "$out" || { echo "::error::$t 没有执行，profiling 用例可能根本没编进来"; exit 1; }
          done
          echo "MiddlewareProfilingTest 三条关键用例均已执行通过"

  # ── PR 自动打标签 ──
  labeler:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/labeler@v5
        with:
          sync-labels: true
