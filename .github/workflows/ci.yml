name: CI

env:
  # 性能用例在共享 runner 上抖动，统一排除。
  # RouterPerfTest / PerfectHashPerfTest 已经不存在了（前者测试文件已删，后者变成
  # benchmarks/ 下的 BM_*），别再往这里加死名字。
  CI_TEST_EXCLUDE: 'HttpServerPerfTest'

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
      - 'docker-compose*.yml'
      - 'ports/**'
      - 'benchmark/**'
  pull_request:
    branches: [main]
    # 不按路径过滤：main 的必需检查依赖本 workflow 的 gcc/clang job，
    # 一旦跳过就是 pending，只改文档的 PR 会被永久卡住。
  workflow_dispatch:
    inputs:
      run_http2_interop:
        description: '运行固定外部工具的原生双向 HTTP/2 互操作（较慢）'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  http2-dependency-tests:
    name: HTTP2 dependency extraction tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_ci_http2_deps.py -v

  # 原有 build/profiling 保持 OFF；H2 双端使用独立前缀，不借用 Ubuntu apt Boost 1.83。
  http2:
    needs: http2-dependency-tests
    name: HTTP2 ON / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
            cc: gcc-14
            cxx: g++-14
            configuration: Release
            sanitizer: none
            sanitizerTag: none
          - os: ubuntu-24.04
            compiler: clang
            cc: clang-20
            cxx: clang++-20
            configuration: Debug
            sanitizer: address,undefined
            # 缓存 key 不允许逗号，这里得单独给一个干净的名字。
            sanitizerTag: asan-ubsan
          - os: windows-latest
            compiler: msys2-gcc
            cc: gcc
            cxx: g++
            configuration: Release
            sanitizer: none
            sanitizerTag: none
          - os: windows-latest
            compiler: msvc
            cc: cl
            cxx: cl
            configuration: Release
            sanitizer: none
            sanitizerTag: none
    env:
      HICAL_REQUIRE_SSL_CERTS: '1'
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.compiler != 'msys2-gcc'
        with:
          python-version: '3.12'
      - name: CMake / Ninja
        if: matrix.compiler != 'msys2-gcc'
        run: |
          python -m pip install --only-binary=:all: cmake==4.4.3 ninja==1.13.0
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --proto '=https' https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc >/dev/null
          echo 'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' | sudo tee /etc/apt/sources.list.d/llvm-20.list
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 clang-20 libssl-dev libgtest-dev zlib1g-dev
      - name: MSYS2 system dependencies
        if: matrix.compiler == 'msys2-gcc'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          cache: true
          # install 是折叠标量，里面不能写注释——整行都会被当成包名丢给 pacman。
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-gtest
            mingw-w64-x86_64-python
            mingw-w64-x86_64-sccache
            curl
      - name: MSVC environment
        if: matrix.compiler == 'msvc'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vsPath) { throw '找不到已安装的 MSVC 工具链' }
          $previousEnvironment = @{}
          Get-ChildItem Env: | ForEach-Object { $previousEnvironment[$_.Name] = $_.Value }
          & "$vsPath/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          Get-Command cl.exe -ErrorAction Stop | Out-Null
          # 后续步骤会启动新进程，只保存开发环境改动过的变量。
          Get-ChildItem Env: |
            Where-Object { $_.Name -notmatch '^(GITHUB_|RUNNER_|NODE_OPTIONS$)' -and $_.Value -ne $previousEnvironment[$_.Name] } |
            ForEach-Object { "$($_.Name)=$($_.Value)" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 }
      # 必须在 vcpkg install 之前恢复：缓存的是 OpenSSL 等包的编译产物，
      # 从源码编一遍要七分钟，这是 http2 的 MSVC 最贵的一段。
      - name: Setup vcpkg cache (MSVC)
        if: matrix.compiler == 'msvc'
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-msvc-x64-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-msvc-x64-
      - name: MSVC system dependencies in workspace
        if: matrix.compiler == 'msvc'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl zlib gtest --classic --triplet x64-windows-static-md --x-install-root="$env:GITHUB_WORKSPACE/build-h2-vcpkg"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # 编译器的启动器：ccache 挂在工具链外面，缓存的是整个编译动作。
      # key 必须带 configuration 和 sanitizer，Debug+ASan 和 Release 的产物不通用。
      - name: Setup ccache (Linux)
        if: runner.os == 'Linux'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: http2-${{ matrix.os }}-${{ matrix.cc }}-${{ matrix.configuration }}-${{ matrix.sanitizerTag }}
          # 主构建 362 个编译单元，冷编译要十分钟；命中后只剩增量。
          # 仓库缓存总共 10G，四份 1G 的 ccache 会把 prefix 和 vcpkg 挤出去，
          # 落到 500M 够用，挤掉别人的代价比少存一点缓存大得多。
          max-size: 500M
      # MSYS2 这条不用 ccache：msys 那份是 POSIX 运行时程序，只认 / 分隔符，
      # 而 CMake 生成的是 D:\a\_temp\... 反斜杠路径，ccache 认不出是路径，
      # 当成编译器名字去 PATH 里找，直接报 Could not find compiler。
      # sccache 是原生 Windows 程序，没有这个问题。
      # key 带 sha 是为了每次提交都能把新编出来的缓存存下来；
      # restore-keys 负责从最近一条恢复出增量。
      - name: Cache sccache (MSYS2)
        if: matrix.compiler == 'msys2-gcc'
        uses: actions/cache@v4
        with:
          path: .sccache
          key: http2-sccache-${{ matrix.os }}-${{ matrix.cc }}-${{ github.sha }}
          restore-keys: |
            http2-sccache-${{ matrix.os }}-${{ matrix.cc }}-
      - name: Cache verified source archives
        uses: actions/cache@v4
        with:
          path: build-h2-deps/downloads
          key: http2-sources-boost190-ng170-${{ runner.os }}-${{ hashFiles('scripts/ci_http2_deps.py') }}
      # prefix 只跟编译器、配置、sanitizer 有关，跟源码无关。
      # hashFiles 盯的是构建参数（版本号、编译开关这些），脚本一改就重建，
      # 宁可多编一次也不要用一套和当前参数对不上的产物。
      # 另外脚本自己还会校验版本宏和静态库，缓存残缺时会被丢掉重来。
      - name: Cache fixed dependency prefix
        uses: actions/cache@v4
        with:
          path: build-h2-deps/prefix
          key: http2-prefix-${{ runner.os }}-${{ matrix.cc }}-${{ matrix.configuration }}-${{ matrix.sanitizerTag }}-${{ hashFiles('scripts/ci_http2_deps.py') }}
      - name: Build fixed dependencies (Linux)
        if: runner.os == 'Linux'
        run: >-
          python scripts/ci_http2_deps.py --root build-h2-deps --compiler ${{ matrix.compiler }}
          --cc ${{ matrix.cc }} --cxx ${{ matrix.cxx }} --configuration ${{ matrix.configuration }}
          --sanitizer ${{ matrix.sanitizer }} --build
      - name: Build fixed dependencies (MSYS2)
        if: matrix.compiler == 'msys2-gcc'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # 这步编的是 Boost 和 nghttp2，b2 和 CMake 都直接用原始工具链，
          # 不经过 ccache，所以这里什么都不用配。
          python scripts/ci_http2_deps.py --root build-h2-deps --compiler gcc --cc gcc --cxx g++ --build
      - name: Build fixed dependencies (MSVC)
        if: matrix.compiler == 'msvc'
        run: python scripts/ci_http2_deps.py --root build-h2-deps --compiler msvc --cc cl --cxx cl --build
      - name: Configure / build / test H2 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [[ '${{ matrix.sanitizer }}' != none ]]; then
            extra+=("-DCMAKE_C_FLAGS=-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer")
            extra+=("-DCMAKE_CXX_FLAGS=-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer")
            extra+=("-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=${{ matrix.sanitizer }}")
          fi
          cmake -B build-h2 -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="$PWD/build-h2-deps/prefix" \
            -DBoost_DIR="$PWD/build-h2-deps/prefix/lib/cmake/Boost-1.90.0" \
            -DNghttp2_ROOT="$PWD/build-h2-deps/prefix" \
            -DHICAL_WITH_HTTP2=ON -DHICAL_WITH_HTTP_CLIENT=ON -DHICAL_DISABLE_IO_URING=ON \
            "${extra[@]}" 2>&1 | tee build-h2-configure.log
          # ASan+UBSan 的 Debug 编译很吃内存，runner 只有 7G，别开满。
          jobs=$([[ '${{ matrix.sanitizer }}' == none ]] && nproc || echo 2)
          cmake --build build-h2 --parallel "$jobs" 2>&1 | tee build-h2-build.log
          python scripts/gen_test_certs.py --out-dir build-h2/tests
          ctest --test-dir build-h2 -N 2>&1 | tee build-h2-discovery.log
          ctest --test-dir build-h2 --show-only=json-v1 > build-h2/discovery.json
          python -c "import json; n=[t['name'] for t in json.load(open('build-h2/discovery.json'))['tests']]; required=('AsyncHttpClientNetworkTest.','Http2Client','Http2Pool','Http2Lifecycle','Http2Drain','Http2File','Http2Cancellation'); assert all(any(x.startswith(r) for x in n) for r in required)"
          ctest --test-dir build-h2 --no-tests=error --output-on-failure --timeout 120 -j2 \
            -E "${{ env.CI_TEST_EXCLUDE }}" --output-junit "$PWD/build-h2-tests.xml" 2>&1 | tee build-h2-tests.log
      - name: Configure / build / test H2 (MSYS2)
        if: matrix.compiler == 'msys2-gcc'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # sccache 原生支持 Windows 路径，缓存目录放工作区里好让 actions/cache 收走。
          export SCCACHE_DIR="$(cygpath -m "$PWD/.sccache")"
          export SCCACHE_CACHE_SIZE=500M
          # 名字或路径对不上就当场报错，别等编到一半才发现。
          command -v sccache
          sccache --version
          prefix="$(cygpath -m "$PWD/build-h2-deps/prefix")"
          cmake -B build-h2 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_PREFIX_PATH="$prefix" -DBoost_DIR="$prefix/lib/cmake/Boost-1.90.0" \
            -DNghttp2_ROOT="$prefix" -DHICAL_WITH_HTTP2=ON -DHICAL_WITH_HTTP_CLIENT=ON 2>&1 | tee build-h2-configure.log
          cmake --build build-h2 --parallel "$(nproc)" 2>&1 | tee build-h2-build.log
          sccache --show-stats
          python scripts/gen_test_certs.py --out-dir build-h2/tests
          ctest --test-dir build-h2 -N 2>&1 | tee build-h2-discovery.log
          ctest --test-dir build-h2 --show-only=json-v1 > build-h2/discovery.json
          python -c "import json; n=[t['name'] for t in json.load(open('build-h2/discovery.json'))['tests']]; required=('AsyncHttpClientNetworkTest.','Http2Client','Http2Pool','Http2Lifecycle','Http2Drain','Http2File','Http2Cancellation'); assert all(any(x.startswith(r) for x in n) for r in required)"
          ctest --test-dir build-h2 --no-tests=error --output-on-failure --timeout 120 -j2 \
            -E "${{ env.CI_TEST_EXCLUDE }}" --output-junit "$PWD/build-h2-tests.xml" 2>&1 | tee build-h2-tests.log
      - name: Configure / build / test H2 (MSVC)
        if: matrix.compiler == 'msvc'
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE.Replace('\', '/')
          $prefix = "$workspace/build-h2-deps/prefix"
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT.Replace('\', '/')
          cmake -B build-h2 -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_INSTALLED_DIR="$workspace/build-h2-vcpkg" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md -DCMAKE_VS_GLOBALS=VcpkgEnabled=false `
            -DCMAKE_PREFIX_PATH="$prefix" `
            -DBoost_DIR="$prefix/lib/cmake/Boost-1.90.0" `
            -DNghttp2_ROOT="$prefix" `
            -DHICAL_WITH_HTTP2=ON -DHICAL_WITH_HTTP_CLIENT=ON 2>&1 | Tee-Object build-h2-configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # cl 处理重模板单进程要 1.5~2G，4 路并行会贴到 8G，先把上限压到 3。
          $jobs = [Math]::Min([int]$env:NUMBER_OF_PROCESSORS, 3)
          cmake --build build-h2 --parallel $jobs 2>&1 | Tee-Object build-h2-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/gen_test_certs.py --out-dir build-h2/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-h2 -N 2>&1 | Tee-Object build-h2-discovery.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-h2 --show-only=json-v1 > build-h2/discovery.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json; n=[t['name'] for t in json.load(open('build-h2/discovery.json',encoding='utf-8-sig'))['tests']]; required=('AsyncHttpClientNetworkTest.','Http2Client','Http2Pool','Http2Lifecycle','Http2Drain','Http2File','Http2Cancellation'); assert all(any(x.startswith(r) for x in n) for r in required)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-h2 --no-tests=error --output-on-failure --timeout 120 -j2 `
            -E "${{ env.CI_TEST_EXCLUDE }}" --output-junit "$PWD/build-h2-tests.xml" 2>&1 | Tee-Object build-h2-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve H2 logs and dependency identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http2-${{ matrix.compiler }}
          path: |
            build-h2-*.log
            build-h2-tests.xml
            build-h2/discovery.json
            build-h2/CMakeCache.txt
            build-h2/Testing/
            build-h2-deps/manifest.json
            build-h2-deps/logs/
          if-no-files-found: warn

  # 外部工具互操作耗时较长，仅在手动运行时启用。
  http2-interop:
    needs: http2-dependency-tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_http2_interop
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      HICAL_REQUIRE_SSL_CERTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: summerwind/h2spec
          ref: 70ac2294010887f48b18e2d64f5cccd48421fad1
          path: build-h2-deps/h2spec-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
          cache: false
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 libssl-dev libgtest-dev zlib1g-dev libev-dev libc-ares-dev libjansson-dev libxml2-dev
          python -m pip install --only-binary=:all: cmake==4.4.3 ninja==1.13.0
      # 手动触发的 job 同样要从源码编 Boost，缓存命中的话能省十来分钟。
      - name: Cache fixed dependency prefix
        uses: actions/cache@v4
        with:
          path: build-h2-deps/prefix
          key: http2-prefix-${{ runner.os }}-gcc-interop-${{ hashFiles('scripts/ci_http2_deps.py') }}
      - name: Build fixed library and independent CLI tools
        run: >-
          python scripts/ci_http2_deps.py --root build-h2-deps --compiler gcc --cc gcc-14 --cxx g++-14
          --build --interop-tools --h2spec-source build-h2-deps/h2spec-source
      - name: Build production probes
        shell: bash
        run: |
          set -euo pipefail
          cmake -B build-h2 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_PREFIX_PATH="$PWD/build-h2-deps/prefix" -DBoost_DIR="$PWD/build-h2-deps/prefix/lib/cmake/Boost-1.90.0" \
            -DNghttp2_ROOT="$PWD/build-h2-deps/prefix" \
            -DHICAL_WITH_HTTP2=ON -DHICAL_WITH_HTTP_CLIENT=ON -DHICAL_DISABLE_IO_URING=ON 2>&1 | tee build-h2-configure.log
          cmake --build build-h2 --parallel 2 --target http2_interop_server http2_interop_client 2>&1 | tee build-h2-build.log
          python scripts/gen_test_certs.py --out-dir build-h2/tests
      - name: Run native bidirectional interoperability
        run: >-
          python scripts/test_http2_interop.py
          --server-driver build-h2/tests/http2_interop_server --client-driver build-h2/tests/http2_interop_client
          --nghttp build-h2-deps/prefix/bin/nghttp --nghttpd build-h2-deps/prefix/bin/nghttpd
          --h2load build-h2-deps/prefix/bin/h2load --h2spec build-h2-deps/prefix/bin/h2spec
          --cert build-h2/tests/test_server.crt --key build-h2/tests/test_server.key --ca build-h2/tests/test_server.crt
          --expected-nghttp-version 1.70.0 --external-insecure --build-source-identity ${{ github.sha }}
          --h2spec-max-header-length 3000 --h2spec-rfc9113-review docker/test/http2/h2spec-rfc9113.json
          --out build-h2-interop
      - name: Preserve every interoperability case and raw log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http2-native-interop
          path: |
            build-h2-interop/
            build-h2-*.log
            build-h2-deps/manifest.json
            build-h2-deps/logs/
          if-no-files-found: warn

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
            cc: gcc-14
            cxx: g++-14
            cmake: "4.4.3"
          - os: ubuntu-24.04
            compiler: clang
            cc: clang-20
            cxx: clang++-20
            cmake: "4.4.3"
          - os: ubuntu-24.04
            compiler: gcc-cmake-minimum
            cc: gcc-14
            cxx: g++-14
            cmake: "3.28.4"
          - os: windows-latest
            compiler: msys2-gcc
          - os: windows-latest
            compiler: msvc
            cmake: "4.4.3"

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    # 最慢的单例约 19 分钟，90 分钟留足余量。
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        if: matrix.compiler != 'msys2-gcc'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CMake
        if: matrix.compiler != 'msys2-gcc'
        run: |
          python -m pip install --only-binary=:all: "cmake==${{ matrix.cmake }}"
          cmake --version
          ctest --version
          python -c "import subprocess; actual = subprocess.check_output(['cmake', '--version'], text=True).splitlines()[0]; assert actual == 'cmake version ${{ matrix.cmake }}', actual"

      # ── Linux 依赖 ──
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" | sudo tee /etc/apt/sources.list.d/llvm-20.list
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev libssl-dev libgtest-dev liburing-dev zlib1g-dev gcovr clang-20 clang-tidy-20
          pip install clang-format==22.1.2

      # ── ccache 加速编译 (Linux) ──
      - name: Setup ccache
        if: runner.os == 'Linux'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.os }}-${{ matrix.compiler }}
          # gcc 那条要同时缓存 Release 和 Debug+coverage 两套产物，
          # 默认 500MB 装不下，会被来回挤掉。clang 只有一套，给多了也是浪费。
          max-size: ${{ matrix.compiler == 'gcc' && '2G' || '500M' }}

      # ── Linux 构建与测试 ──
      - name: Configure (Linux)
        if: runner.os == 'Linux' && matrix.compiler != 'clang'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DHICAL_DISABLE_IO_URING=ON \
            -DHICAL_WITH_HTTP2=OFF \
            -DHICAL_WITH_HTTP_CLIENT=OFF

      - name: Build (Linux)
        if: runner.os == 'Linux' && matrix.compiler != 'clang'
        run: cmake --build build -j$(nproc)

      - name: Generate test certificates (Linux)
        if: runner.os == 'Linux' && matrix.compiler != 'clang'
        run: python3 scripts/gen_test_certs.py

      - name: Test (Linux)
        if: runner.os == 'Linux' && matrix.compiler != 'clang'
        run: |
          ctest --test-dir build -N
          ctest --test-dir build --no-tests=error --output-on-failure --timeout 60 -j4 -E "${{ env.CI_TEST_EXCLUDE }}"
        env:
          HICAL_REQUIRE_SSL_CERTS: "1"

      # ── Clang: Sanitizer 构建 (ASan + UBSan) ──
      - name: Configure with sanitizers (Clang)
        if: matrix.compiler == 'clang'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DHICAL_DISABLE_IO_URING=ON \
            -DHICAL_WITH_HTTP2=OFF \
            -DHICAL_WITH_HTTP_CLIENT=OFF

      - name: Build with sanitizers (Clang)
        if: matrix.compiler == 'clang'
        run: cmake --build build -j$(nproc)

      - name: Generate test certificates (Clang)
        if: matrix.compiler == 'clang'
        run: python3 scripts/gen_test_certs.py

      - name: Test with sanitizers (Clang)
        if: matrix.compiler == 'clang'
        run: |
          ctest --test-dir build -N
          ctest --test-dir build --no-tests=error --output-on-failure --timeout 120 -j4 -E "${{ env.CI_TEST_EXCLUDE }}"
        env:
          HICAL_REQUIRE_SSL_CERTS: "1"

      # ── clang-tidy 检查 (仅 Clang job, 警告模式) ──
      - name: Run clang-tidy
        if: matrix.compiler == 'clang'
        continue-on-error: true
        run: |
          find src -name '*.cpp' | xargs clang-tidy-20 -p build

      # ── 代码覆盖率 (仅 GCC job) ──
      - name: Build with coverage (GCC)
        if: matrix.compiler == 'gcc'
        run: |
          cmake -B build-cov -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -DCMAKE_C_FLAGS="--coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DHICAL_DISABLE_IO_URING=ON \
            -DHICAL_WITH_HTTP2=OFF \
            -DHICAL_WITH_HTTP_CLIENT=OFF
          cmake --build build-cov -j$(nproc)

      - name: Generate test certificates (coverage)
        if: matrix.compiler == 'gcc'
        run: python3 scripts/gen_test_certs.py --out-dir build-cov/tests

      - name: Run tests for coverage
        if: matrix.compiler == 'gcc'
        run: |
          ctest --test-dir build-cov -N
          ctest --test-dir build-cov --no-tests=error --output-on-failure --timeout 60 -j4 -E "${{ env.CI_TEST_EXCLUDE }}"
        env:
          HICAL_REQUIRE_SSL_CERTS: "1"

      - name: Generate coverage report
        if: matrix.compiler == 'gcc'
        run: |
          gcovr --xml -o coverage.xml \
            --gcov-executable gcov-14 \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            --root . --filter 'src/' \
            --exclude 'tests/' --exclude 'examples/'

      - name: Upload coverage to Codecov
        if: matrix.compiler == 'gcc'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # ── 自动格式化修复 (仅 GCC job, 仅非 fork 的 PR) ──
      - name: Auto-fix formatting
        if: >-
          matrix.compiler == 'gcc'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          mapfile -t files < <(find src tests examples -path '*/third_party' -prune -o \( -name '*.h' -o -name '*.cpp' \) -print)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "没有需要格式化的文件"
            exit 0
          fi
          clang-format -i "${files[@]}"
          python3 scripts/fix-comment-indent.py "${files[@]}"

      - name: Commit formatting fixes
        if: >-
          matrix.compiler == 'gcc'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[chore] auto-fix formatting"
          branch: ${{ github.head_ref }}

      # ── clang-format 严格检查 (GCC job: push 到 main 或 PR 均检查) ──
      - name: Check formatting
        if: matrix.compiler == 'gcc'
        run: |
          find src tests examples -path '*/third_party' -prune -o \( -name '*.h' -o -name '*.cpp' \) -print | \
            xargs clang-format --dry-run --Werror
          python3 scripts/fix-comment-indent.py --check \
            $(find src tests examples -path '*/third_party' -prune -o \( -name '*.h' -o -name '*.cpp' \) -print)

      # ── Windows MSYS2 ──
      - name: Setup MSYS2
        if: matrix.compiler == 'msys2-gcc'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          cache: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-gtest
            mingw-w64-x86_64-python

      - name: Configure (MSYS2)
        if: matrix.compiler == 'msys2-gcc'
        shell: msys2 {0}
        run: |
          cmake --version
          cmake --version | grep '^cmake version 4\.'
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHICAL_WITH_HTTP2=OFF -DHICAL_WITH_HTTP_CLIENT=OFF

      - name: Build (MSYS2)
        if: matrix.compiler == 'msys2-gcc'
        shell: msys2 {0}
        run: cmake --build build

      - name: Generate test certificates (MSYS2)
        if: matrix.compiler == 'msys2-gcc'
        shell: msys2 {0}
        run: python scripts/gen_test_certs.py

      - name: Test (MSYS2)
        if: matrix.compiler == 'msys2-gcc'
        shell: msys2 {0}
        env:
          HICAL_REQUIRE_SSL_CERTS: "1"
        run: |
          ctest --test-dir build -N
          ctest --test-dir build --no-tests=error --output-on-failure --timeout 60 -j4 -E "${{ env.CI_TEST_EXCLUDE }}" || {
            echo "First attempt failed (likely MinGW exit-time segfault), retrying..."
            ctest --test-dir build --no-tests=error --output-on-failure --timeout 60 -j4 -E "${{ env.CI_TEST_EXCLUDE }}"
          }

      # ── Windows MSVC ──
      - name: Install ninja (MSVC)
        if: matrix.compiler == 'msvc'
        run: choco install ninja ccache -y

      - name: Setup ccache (MSVC)
        if: matrix.compiler == 'msvc'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.os }}-${{ matrix.compiler }}

      - name: Setup vcpkg cache (MSVC)
        if: matrix.compiler == 'msvc'
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-msvc-x64-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-msvc-x64-

      - name: Configure (MSVC)
        if: matrix.compiler == 'msvc'
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DHICAL_WITH_HTTP2=OFF -DHICAL_WITH_HTTP_CLIENT=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
        env:
          CCACHE_COMPILERTYPE: msvc

      - name: Build (MSVC)
        if: matrix.compiler == 'msvc'
        run: cmake --build build --config Release
        env:
          CCACHE_COMPILERTYPE: msvc

      - name: Generate test certificates (MSVC)
        if: matrix.compiler == 'msvc'
        run: python scripts/gen_test_certs.py

      - name: Test (MSVC)
        if: matrix.compiler == 'msvc'
        run: |
          ctest --test-dir build -N -C Release
          ctest --test-dir build --no-tests=error --output-on-failure --timeout 60 -j4 -C Release -E "${{ env.CI_TEST_EXCLUDE }}"
        env:
          HICAL_REQUIRE_SSL_CERTS: "1"

  # ── 中间件 profiling 构建（打开 HICAL_ENABLE_MIDDLEWARE_PROFILING） ──
  # 这个选项默认 OFF，上面那个 build job 从来不开它，于是 tests/test_middleware.cpp 里
  # #ifdef HICAL_ENABLE_MIDDLEWARE_PROFILING 包住的 MiddlewareProfilingTest 用例在所有
  # CI 里都不参与编译。那几条用例守的是「profiling 模式下 Sync 中间件被整条丢弃、认证/限流
  # 静默 fail-open」这个缺陷，没人守着的话，重构 MiddlewarePipeline::build() 会无声退回原状。
  # 只起 Linux + GCC 一路，不铺矩阵，CI 时间克制。
  middleware-profiling:
    runs-on: ubuntu-24.04
    name: ubuntu-24.04 / gcc / middleware-profiling
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CMake
        run: |
          python -m pip install --only-binary=:all: cmake==4.4.3
          cmake --version
          ctest --version
          python -c "import subprocess; actual = subprocess.check_output(['cmake', '--version'], text=True).splitlines()[0]; assert actual == 'cmake version 4.4.3', actual"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev libssl-dev libgtest-dev liburing-dev zlib1g-dev

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ubuntu-24.04-gcc-middleware-profiling

      - name: Configure (middleware profiling)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DHICAL_ENABLE_MIDDLEWARE_PROFILING=ON \
            -DHICAL_DISABLE_IO_URING=ON \
            -DHICAL_WITH_HTTP2=OFF \
            -DHICAL_WITH_HTTP_CLIENT=OFF

      - name: Build (middleware profiling)
        run: cmake --build build -j$(nproc)

      - name: Generate test certificates (middleware profiling)
        run: python3 scripts/gen_test_certs.py

      - name: Test (middleware profiling)
        run: |
          ctest --test-dir build -N
          ctest --test-dir build --no-tests=error --output-on-failure --timeout 60 -j4 -E "${{ env.CI_TEST_EXCLUDE }}"
        env:
          HICAL_REQUIRE_SSL_CERTS: "1"

      # 光看 ctest 绿没用：profiling 没打开、用例被 #ifdef 编没了的时候 gtest 照样返回 0
      # （只打印 "0 tests from 0 test suites" 和一句 WARNING）。所以这里显式逐条确认用例名
      # 真的出现在 [ OK ] 行里，把「跑了」和「没编进来」区分开。
      - name: Assert MiddlewareProfilingTest actually ran
        run: |
          bin=$(find build -type f -name 'test_middleware' -print -quit)
          if [[ -z $bin || ! -x $bin ]]; then
            echo "::error::找不到 test_middleware 测试可执行文件，构建产物布局和预期不符"
            exit 1
          fi
          out=$("$bin" --gtest_filter='MiddlewareProfilingTest.*' --gtest_color=no)
          echo "$out"
          for t in MiddlewareProfilingTest.SyncMiddlewareStillRunsInsteadOfBeingDropped \
                   MiddlewareProfilingTest.MixedSyncAndAsyncFallsBackWithoutFakeStats \
                   MiddlewareProfilingTest.BuildForKeepsSyncMiddleware; do
            grep -q "OK ] $t" <<< "$out" || { echo "::error::$t 没有执行，profiling 用例可能根本没编进来"; exit 1; }
          done
          echo "MiddlewareProfilingTest 三条关键用例均已执行通过"
