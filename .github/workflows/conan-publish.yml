name: Conan Publish

on:
  # tag 触发：推送 v* 标签时验证并发布 Conan 包
  push:
    tags:
      - "v*"
  # 手动触发
  workflow_dispatch:
    inputs:
      version_override:
        description: "覆盖版本号（留空则从 CMakeLists.txt 读取）"
        required: false

# CCI 审核中，过渡方案：验证构建 + 打包到 GitHub Release
# CCI 通过后可移除 Release 上传步骤

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GCC —— 最通用的二进制包
          - os: ubuntu-24.04
            compiler: gcc
            cc: gcc-14
            cxx: g++-14
          # Windows MSVC —— Windows 用户的主要选择
          - os: windows-latest
            compiler: msvc

    runs-on: ${{ matrix.os }}
    name: Conan Publish (${{ matrix.os }} / ${{ matrix.compiler }})

    steps:
      - uses: actions/checkout@v4

      # ── 安装 Conan ──
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect

      # ── Linux 依赖 ──
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev libssl-dev zlib1g-dev cmake

      # ── Windows MSVC：预装 ninja 避免 vcpkg 下载失败 ──
      - name: Install ninja (MSVC)
        if: matrix.compiler == 'msvc'
        run: choco install ninja -y

      # ── Windows MSVC：vcpkg 缓存 ──
      - name: Setup vcpkg cache (MSVC)
        if: matrix.compiler == 'msvc'
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-conan-msvc-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-conan-msvc-

      # ── 提取版本号 ──
      - name: Extract version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version_override }}" ]; then
            VER="${{ github.event.inputs.version_override }}"
          else
            VER=$(sed -n 's/.*project\s*(\s*hical\s\+VERSION\s\+\([0-9.]*\).*/\1/p' CMakeLists.txt)
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${VER}"

      # ── 创建 Conan 包 ──
      - name: Conan create (Linux)
        if: runner.os == 'Linux'
        run: |
          conan create . \
            --version=${{ steps.version.outputs.version }} \
            --build=missing \
            -s compiler=gcc \
            -s compiler.version=14 \
            -s compiler.cppstd=20 \
            -s build_type=Release \
            -o "boost/*:without_cobalt=True"

      - name: Conan create (MSVC)
        if: matrix.compiler == 'msvc'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          conan create . ^
            --version=${{ steps.version.outputs.version }} ^
            --build=missing ^
            -s compiler.cppstd=20 ^
            -s build_type=Release ^
            -c tools.cmake.cmaketoolchain:generator=Ninja ^
            -o "boost/*:without_cobalt=True"

      # ── 打包源码分发包并上传到 GitHub Release ──
      # 仅 Linux job + tag 触发时执行（源码包跨平台通用，只需上传一次）
      - name: Package Conan source
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        run: |
          VER=${{ steps.version.outputs.version }}
          mkdir -p dist/hical
          cp conanfile.py dist/hical/
          cp CMakeLists.txt dist/hical/
          cp LICENSE dist/hical/
          cp -r cmake dist/hical/
          cp -r src dist/hical/
          cp -r test_package dist/hical/
          tar -czf "hical-${VER}-conan-src.tar.gz" -C dist hical
          echo "Packaged: hical-${VER}-conan-src.tar.gz ($(du -h hical-${VER}-conan-src.tar.gz | cut -f1))"

      - name: Upload to GitHub Release
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: hical-*-conan-src.tar.gz
          fail_on_unmatched_files: false
