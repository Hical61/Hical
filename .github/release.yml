changelog:
  categories:
    - title: "New Features"
      labels:
        - feat
        - feature
        - enhancement
    - title: "Bug Fixes"
      labels:
        - fix
        - bug
        - bugfix
    - title: "Performance"
      labels:
        - perf
        - performance
    - title: "Documentation"
      labels:
        - docs
        - documentation
    - title: "Other Changes"
      labels:
        - chore
        - ci
        - refactor
        - test
        - build
  exclude:
    labels:
      - skip-changelog
      - duplicate
      - invalid
      - wontfix
