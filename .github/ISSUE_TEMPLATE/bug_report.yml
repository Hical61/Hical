name: Bug Report / 缺陷报告
description: Report a bug / 报告一个缺陷
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! / 感谢反馈！
  - type: textarea
    id: description
    attributes:
      label: Description / 描述
      description: What happened? / 发生了什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce / 复现步骤
      description: Minimal steps to reproduce the issue / 最小复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior / 期望行为
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Platform / 平台
      options:
        - Linux (GCC)
        - Linux (Clang)
        - Windows (MSYS2 MinGW)
        - Windows (MSVC)
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: compiler
    attributes:
      label: Compiler Version / 编译器版本
      placeholder: "e.g. GCC 14.2, Clang 20.1"
  - type: input
    id: boost
    attributes:
      label: Boost Version / Boost 版本
      placeholder: "e.g. 1.86.0"
  - type: textarea
    id: logs
    attributes:
      label: Build/Runtime Logs / 构建/运行日志
      render: shell
