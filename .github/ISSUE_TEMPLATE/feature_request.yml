name: Feature Request / 功能建议
description: Suggest a feature / 建议一个新功能
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 问题
      description: What problem does this solve? / 这解决什么问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered / 替代方案
  - type: textarea
    id: context
    attributes:
      label: Additional Context / 补充说明
