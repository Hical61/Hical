# Hical 生产部署：Hical + MySQL + Nginx
#
# 用法：
#   构建并启动:  docker compose up -d --build
#   查看日志:    docker compose logs -f hical
#   停止并清理:  docker compose down -v

services:
  # ---- Hical 应用服务器 ----
  hical:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8080
      - IO_THREADS=4
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - LOG_OUTPUT=stderr
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=hical
      - MYSQL_PASSWORD=hical_password
      - MYSQL_DATABASE=hical_prod
      - DB_MIN_CONNS=2
      - DB_MAX_CONNS=16
      - CORS_ORIGIN=*
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 1G
        reservations:
          cpus: "1"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    networks:
      - backend
    depends_on:
      mysql:
        condition: service_healthy

  # ---- MySQL 数据库 ----
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=hical_prod
      - MYSQL_USER=hical
      - MYSQL_PASSWORD=hical_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    networks:
      - backend

  # ---- Nginx 反向代理 ----
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./certs:/etc/nginx/certs:ro
      # - ./static:/usr/share/nginx/html/static:ro
    depends_on:
      hical:
        condition: service_healthy
    networks:
      - frontend
      - backend

volumes:
  mysql_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
